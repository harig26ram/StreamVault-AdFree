<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PoToken Generator</title>
</head>
<body>
<script>
    // BotGuard state
    let botguard = null;
    let integrityToken = null;
    let webPoSignalOutput = null;

    // Load and run BotGuard challenge
    async function downloadAndRunBotguard(challengeData) {
        try {
            const program = challengeData.program;
            const interpreterUrl = challengeData.interpreterUrl;

            // Load the BotGuard interpreter
            const response = await fetch(interpreterUrl);
            const interpreterJs = await response.text();

            // Execute interpreter
            eval(interpreterJs);

            // Create BotGuard VM instance
            botguard = new botguard.BotGuard({
                program: program,
                globalName: 'WEB_SABR_MITER_NAME'
            });

            // Run with callback
            botguard.invoke(function(token) {
                // Send response back to Android
                if (typeof PoTokenWebView !== 'undefined') {
                    PoTokenWebView.onBotguardResponse(token);
                }
            });
        } catch (e) {
            if (typeof PoTokenWebView !== 'undefined') {
                PoTokenWebView.onBotguardError(e.toString());
            }
        }
    }

    // Set integrity token (called after GenerateIT)
    function setIntegrityToken(token) {
        integrityToken = token;
    }

    // Obtain PO token using minter function
    function obtainPoToken(identifier) {
        return new Promise((resolve, reject) => {
            try {
                if (!integrityToken) {
                    reject('Integrity token not set');
                    return;
                }

                // Convert identifier to Uint8Array
                const encoder = new TextEncoder();
                const data = encoder.encode(identifier);

                // Call the minter function with integrity token and identifier
                const minter = webPoSignalOutput;
                if (!minter) {
                    reject('Minter not available');
                    return;
                }

                // Mint the PO token
                const poToken = minter({
                    integrityToken: integrityToken,
                    data: data
                });

                resolve(poToken);
            } catch (e) {
                reject('obtainPoToken error: ' + e.message);
            }
        });
    }

    // Set webPoSignalOutput (called from BotGuard)
    function setWebPoSignalOutput(output) {
        webPoSignalOutput = output;
    }
</script>
</body>
</html>
