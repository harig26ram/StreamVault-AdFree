<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreedomPlay — Sample 6: Immersive Pager Feed</title>
<style>
:root{--bg:#000;--surface:#121212;--pink:#FF4081;--txt:#fff;--mut:#9a9a9a;}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,Roboto,Segoe UI,sans-serif;}
body{background:#000;color:#fff;max-width:420px;margin:0 auto;}
.stage{position:relative;height:100vh;background:linear-gradient(160deg,#2a1a2e,#0a0a14);overflow:hidden;}
.stage .topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:14px 16px;z-index:4;background:linear-gradient(180deg,#000c,#0000);}
.stage .tabs{display:flex;gap:18px;font-size:14px;}
.stage .tabs b{color:#fff;border-bottom:2px solid var(--pink);padding-bottom:4px;}
.stage .tabs span{color:#bbb;}
.stage .center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;background:#0008;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;z-index:3;}
.stage .right{position:absolute;right:12px;bottom:90px;display:flex;flex-direction:column;gap:18px;z-index:4;}
.stage .right div{display:flex;flex-direction:column;align-items:center;font-size:10px;color:#fff;gap:3px;}
.stage .right .c{width:42px;height:42px;border-radius:50%;background:#0008;display:flex;align-items:center;justify-content:center;font-size:18px;}
.stage .left{position:absolute;left:14px;bottom:90px;z-index:4;max-width:70%;}
.stage .left .ch{font-size:14px;font-weight:700;}
.stage .left .tt{font-size:14px;margin-top:6px;line-height:1.3;}
.stage .left .actions{display:flex;gap:14px;margin-top:10px;font-size:11px;color:#ddd;}
.stage .left .actions b{color:var(--pink);}
.stage .mini{position:absolute;left:10px;right:10px;bottom:14px;height:48px;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 10px;z-index:5;}
.stage .mini .t{width:54px;height:30px;border-radius:6px;background:linear-gradient(135deg,#2a1a2e,#0a0a14);}
.stage .mini .mt{flex:1;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#eee;}
.stage .mini .pb{width:30px;height:30px;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center;color:#fff;}
</style></head><body>
<div class="stage">
  <div class="topbar"><div class="tabs"><b>Home</b><span>Subscriptions</span><span>Live</span></div><div style="font-size:20px">🔔</div></div>
  <div class="center">▶</div>
  <div class="right">
    <div><div class="c">👍</div>54K</div>
    <div><div class="c">💬</div>2.1K</div>
    <div><div class="c">⤴</div>Save</div>
    <div><div class="c pk" style="color:var(--pink)">⬇</div>DL</div>
    <div><div class="c">↗</div>Share</div>
  </div>
  <div class="left">
    <div class="ch">@TechTutorials</div>
    <div class="tt">The ultimate guide to offline YouTube — download any quality, play in background, EQ on</div>
    <div class="actions"><span><b>⬇</b> Download</span><span>🎚 EQ</span><span>♫ Queue</span><span>⤡ PiP</span><span>⏯ BG</span></div>
  </div>
  <div class="mini"><div class="t"></div><div class="mt">Now playing — background audio on</div><div class="pb">▶</div></div>
</div>
</body></html>
